<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro | Only Cars</title>
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="registro.css">
</head>

<body>

    <nav class="navbar">
        <a href="../index.html" class="logo">Only<span>Cars</span></a>
    </nav>

    <main class="form">
        <div class="auth-card">
            <h2>Registro</h2>
            <form class="auth-form" id="form">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="name" placeholder="Tu nombre completo">
                    <p class="information">Ingresa tu nombre completo</p>
                </div>

                <div class="form-group">
                    <label>Apellido</label>
                    <input type="text" id="lastname" placeholder="Tu apellido">
                    <p class="information">Ingresa tu apellido</p>
                </div>

                <div class="form-group">
                    <label>Correo</label>
                    <input type="email" id="email" placeholder="correo@ejemplo.com">
                    <p class="information">El correo debe seguir el formato: ejemplo@gmail.com</p>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••">
                    <p class="information">Debe contener al menos una mayúscula, una minúscula y un numero. Minimo 6
                        caracteres,
                        maximo 24 caracteres.</p>
                </div>

                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" id="confirm-password" placeholder="••••••••">
                    <p class="information">Debe coincidir con la contraseña</p>
                </div>

                <button type="submit" class="btn-primary btn-full" id="boton" disabled>Continuar</button>
            </form>

            <p class="auth-switch">¿Ya tienes cuenta? <a href="../login/login.html">Iniciar Sesión</a></p>
        </div>
    </main>
    <script src="./registro.js"></script>
</body>

</html>
