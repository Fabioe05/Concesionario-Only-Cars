<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Only Cars</title>
  <link rel="stylesheet" href="../../index.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <nav class="navbar">
    <a href="../../index.html" class="logo">Only<span>Cars</span></a>
  </nav>

  <main class="auth-container">
    <div class="auth-card">
      <h2>Página de Login</h2>
      <form class="auth-form">
        <div class="form-group">
          <label>Correo</label>
          <input type="email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary btn-full">Continuar</button>
      </form>

      <p class="auth-switch">¿No tienes cuenta? <a href="../registro/registro.html">Regístrate</a></p>
    </div>
  </main>

</body>
</html>
