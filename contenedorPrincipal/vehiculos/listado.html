<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos | Only Cars</title>
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="./listado.css">
</head>

<body>
    <nav class="navbar">
        <a href="../../index.html" class="logo">Only<span>Cars</span></a>
        <ul class="nav-links">
            <li><a href="../../index.html#marcas">Marcas</a></li>
            <li><a href="../../index.html#quienes-somos">Quiénes Somos</a></li>
            <li><a href="../../index.html#contacto">Contacto</a></li>
        </ul>
        <div class="nav-auth">
            <a href="../registro/registro.html" id="btn-registro" class="btn-outline">Registro</a>
            <a href="../login/login.html" id="btn-login" class="btn-outline">Login</a>
            <div class="perfil" id="perfil">
                <button type="button" id="btn-perfil" class="perfil-btn" aria-haspopup="true" aria-expanded="false"
                    aria-label="Perfil de usuario">
                    <span id="perfil-iniciales">?</span>
                </button>

                <div class="perfil-panel" id="perfil-panel" hidden>
                    <div class="perfil-cabecera">
                        <span class="perfil-avatar" id="perfil-avatar">?</span>
                        <div class="perfil-titulo">
                            <strong id="perfil-nombre">—</strong>
                            <span class="perfil-rol" id="perfil-rol">—</span>
                        </div>
                    </div>

                    <div class="perfil-datos">
                        <div class="perfil-dato">
                            <span class="perfil-etiqueta">Correo</span>
                            <span id="perfil-correo">—</span>
                        </div>
                        <div class="perfil-dato">
                            <span class="perfil-etiqueta">Registro</span>
                            <span id="perfil-registro">—</span>
                        </div>
                    </div>

                    <a href="../../admin/admin.html" id="btn-admin" class="perfil-admin">Panel de Administración</a>

                    <button type="button" id="btn-cerrar-sesion" class="perfil-salir">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="modelos-header">
            <a href="../../index.html#marcas" class="btn-outline">← Volver a Marcas</a>
            <h1 class="modelos-titulo" id="titulo-marca">Vehículos</h1>
        </div>

        <div class="lista-controles">
            <label for="ordenar">Ordenar por:</label>
            <select id="ordenar">
                <option value="precio-desc">Precio: mayor a menor</option>
                <option value="precio-asc">Precio: menor a mayor</option>
                <option value="anio-desc">Año: más reciente</option>
                <option value="anio-asc">Año: más antiguo</option>
            </select>
        </div>

        <section id="vehiculos-grid" class="lista-vehiculos">
            <p class="msg-vacio">Cargando vehículos...</p>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-info">
                <img src="/img/logo.png" alt="Only Cars" class="footer-logo">
                <p>Av. Principal de las Mercedes, Caracas, Venezuela</p>
                <p>Desarrollado por <a href="https://github.com/Fabioe05/Concesionario-Only-Cars" target="_blank"
                        rel="noopener">Fabio Espinoza</a></p>
            </div>

            <div class="footer-social">
                <a href="https://github.com/Fabioe05/Concesionario-Only-Cars" target="_blank" rel="noopener"
                    class="social-icon" aria-label="GitHub" title="GitHub">
                    <img src="../../img/icons8-github-50.png" alt="" width="50" height="50" decoding="async">
                </a>
                <a href="https://www.instagram.com/onlycars2018/?hl=es" target="_blank" rel="noopener"
                    class="social-icon" aria-label="Instagram" title="Instagram">
                    <img src="../../img/icons8-instagram-50.png" alt="" width="50" height="50" decoding="async">
                </a>
                <a href="https://wa.me/584241667681" target="_blank" rel="noopener" class="social-icon"
                    aria-label="WhatsApp" title="WhatsApp">
                    <img src="../../img/icons8-whatsapp-50.png" alt="" width="50" height="50" decoding="async">
                </a>
            </div>
        </div>
    </footer>

    <script src="../../sesion.js"></script>
    <script src="./listado.js"></script>
</body>

</html>
