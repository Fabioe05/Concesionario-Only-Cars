<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Vehículo | Only Cars</title>
    <link rel="stylesheet" href="../../index.css">
    <link rel="stylesheet" href="./vehiculo.css">
</head>

<body>
    <nav class="navbar">
        <a href="../../index.html" class="logo">Only<span>Cars</span></a>
        <ul class="nav-links">
            <li><a href="../marcas/marcas.html">Marcas</a></li>
            <li><a href="../vendedores/vendedor.html">Quiénes Somos</a></li>
        </ul>
        <div class="nav-auth">
            <a href="../registro/registro.html" class="btn-outline">Registro</a>
            <a href="../login/login.html" class="btn-outline">Login</a>
        </div>
    </nav>

    <main class="container">
        <!-- Título principal dinámico -->
        <h1 class="vehicle-title" id="vehicle-title">Cargando vehículo...</h1>

        <section class="gallery-container">
            <!-- Sección de la Galería -->
            <div class="main-image-wrapper">
                <img id="main-image" src="" alt="Vehículo" />
            </div>
            <div id="thumbnails-container"></div>

            <!-- Modal para ampliar imagen (Lightbox) -->
            <div id="lightbox-modal" class="lightbox-modal">
                <span class="lightbox-close" id="lightbox-close">&times;</span>
                <button class="lightbox-btn lightbox-prev" id="lightbox-prev">&#10094;</button>
                <img class="lightbox-img" id="lightbox-img" src="" alt="Vista ampliada" />
                <button class="lightbox-btn lightbox-next" id="lightbox-next">&#10095;</button>
            </div>

            <!-- Contenedor para las miniaturas/fotos secundarias -->
            <div class="thumbnails-grid" id="thumbnails-container"></div>
        </section>


        <section class="info-box">
            <h2>Información Técnica & Especificaciones</h2>
            <div class="specs-grid">
                <div class="spec-item"><span class="spec-label">Motor:</span> <span class="spec-value"
                        id="vehicle-motor">-</span></div>
                <div class="spec-item"><span class="spec-label">Estatus:</span> <span class="spec-value"
                        id="vehicle-status">-</span></div>
                <div class="spec-item"><span class="spec-label">Transmisión:</span> <span class="spec-value"
                        id="vehicle-transmission">-</span></div>
                <div class="spec-item"><span class="spec-label">Número de dueños:</span> <span class="spec-value"
                        id="vehicle-owners">-</span></div>
                <div class="spec-item"><span class="spec-label">Año:</span> <span class="spec-value"
                        id="vehicle-year">-</span></div>
                <div class="spec-item"><span class="spec-label">Precio:</span> <span class="spec-value"
                        id="vehicle-price">-</span></div>
            </div>
            <p class="vehicle-description" id="vehicle-description"></p>
        </section>

        <div class="cta-container">
            <a href="../cita/cita.html" class="btn-primary btn-large">Contacto / Agendar Cita</a>
        </div>
    </main>

    <footer>
        <div class="footer-bottom">
            <p>Desarrollado por <a href="https://github.com/Fabioe05/Concesionario-Only-Cars" target="_blank">Fabio
                    Espinoza</a></p>
        </div>
    </footer>

    <script src="./vehiculo.js"></script>

</body>

</html>
